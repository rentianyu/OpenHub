apply plugin: 'com.android.application'

def publicProps = new Properties()
rootProject.file('public.properties').withInputStream { publicProps.load(it) }
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def buildProp = { String name ->
    String value = localProps.getProperty(name) ?: publicProps.getProperty(name) ?: ''
    value = value.trim()
    if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
        value = value.substring(1, value.length() - 1)
    }
    return value
}

android {
    namespace 'com.thirtydegreesray.openhub'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.thirtydegreesray.openhub"
        minSdk 21
        targetSdk 34
        versionCode VERSION_CODE as int
        versionName VERSION_NAME
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled false

        buildConfigField "String", "OPENHUB_CLIENT_ID", "\"${buildProp('openhub_client_id')}\""
        buildConfigField "String", "OPENHUB_CLIENT_SECRET", "\"${buildProp('openhub_client_secret')}\""
        buildConfigField "String", "BUGLY_ID", "\"${buildProp('bugly_appid')}\""
        buildConfigField "String", "DEBUG_BUGLY_ID", "\"${buildProp('debug_bugly_appid')}\""
    }

    signingConfigs  {
        release {
            storeFile file(buildProp('sign_path'))
            storePassword buildProp('store_password')
            keyAlias buildProp('key_alias')
            keyPassword buildProp('key_password')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds true
        abortOnError false
        disable 'OldTargetApi', 'GradleDependency', 'ExpiredTargetSdkVersion'
    }

    flavorDimensions "default"

    productFlavors {
        normal {
            dimension "default"
            // add app_name int string.xml
            resValue "string", "app_name", "OpenHub"
        }
        fullName {
            dimension "default"
            // add app_name int string.xml
            resValue "string", "app_name", "OpenHub for GitHub"
        }
    }

    productFlavors.all {
        flavor -> flavor.manifestPlaceholders = [BUGLY_APP_CHANNEL_VALUE: name]
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE',
                         'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module']
        }
    }

}

