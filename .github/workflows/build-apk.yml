name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew :app:assembleNormalRelease :app:assembleNormalDebug --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/normal/release/*.apk; do
            cp "$f" "dist/OpenHub-$(grep -oP 'VERSION_NAME\s*=\s*\K.*' gradle.properties | tr -d ' ')-release.apk"
          done
          for f in app/build/outputs/apk/normal/debug/*.apk; do
            cp "$f" "dist/OpenHub-$(grep -oP 'VERSION_NAME\s*=\s*\K.*' gradle.properties | tr -d ' ')-debug.apk"
          done
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhub-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
